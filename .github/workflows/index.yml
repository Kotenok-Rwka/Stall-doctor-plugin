name: index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "tools/**"
      - "tests/**"
      - ".github/workflows/index.yml"
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - name: Тесты
        run: python -m pytest -q

  index:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # для updated_at из истории git
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Пересобрать индекс
        run: python tools/build_index.py
      - name: Закоммитить индекс, если он изменился
        run: |
          if git diff --quiet -- extera-plugins.json; then
            echo "индекс не изменился"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add extera-plugins.json
            git commit -m "Обновить extera-plugins.json"
            git push
          fi
