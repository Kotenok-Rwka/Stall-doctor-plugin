name: index
on:
  push:
    branches: [main]
    paths: ["plugins/**", "tools/build_index.py"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 -I tests/run_tests.py
      - run: python3 -I tests/test_device_script.py
      - run: python3 -I tools/build_index.py
      - name: Commit index
        run: |
          git config user.name "index-bot"
          git config user.email "index-bot@users.noreply.github.com"
          git add extera-plugins.json
          git diff --cached --quiet || git commit -m "Update extera-plugins.json"
          git push
